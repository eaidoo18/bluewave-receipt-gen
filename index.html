<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BlueWave Invoice</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#e9e9e9;--bar:#f8f8f8;--text:#111;--line:#bbb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2a2a;--bar:#1e1e1e;--text:#eee;--line:#555}}
:root[data-theme="dark"]{--bg:#2a2a2a;--bar:#1e1e1e;--text:#eee;--line:#555}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,Helvetica,sans-serif}
.bar{background:var(--bar);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar select,.bar button,.bar textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);padding:5px 8px}
.bar button{cursor:pointer}
#paste{display:none;width:100%;height:90px}
#msg{opacity:.7}
.scroll{overflow-x:auto;padding:20px 0}
.sheet{position:relative;width:210mm;min-height:297mm;margin:0 auto;background:#fff;color:#000;padding:14mm 17mm;overflow:hidden;font-family:Arial,Helvetica,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.wm{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%) rotate(-38deg);font:bold 68px Arial,Helvetica,sans-serif;color:#d6d6d6;opacity:.55;white-space:nowrap;letter-spacing:2px;pointer-events:none;z-index:0}
.c{position:relative;z-index:1}
.logo{width:48mm;display:block}
.title{text-align:right;margin:-6mm 6mm 0 0;font:italic bold 34px "Courier New",Courier,monospace;color:#3d85c6}
.mono{font-family:"Courier New",Courier,monospace;font-weight:bold;font-size:14px}
.meta{display:flex;justify-content:space-between;margin:20mm 6mm 0 2mm}
.meta div{min-width:70mm}
.meta span{display:block;font-weight:normal;margin-top:6px;font-family:Arial,sans-serif;font-size:14px}
table{width:100%;border-collapse:collapse;table-layout:fixed;margin-top:20mm}
th{background:#1155cc;color:#fff;border:1px solid #000;padding:11px 6px;font:bold 14px "Courier New",Courier,monospace;text-align:center}
td{border-left:1px solid #000;border-right:1px solid #000;padding:5px 8px;vertical-align:top;height:24px}
td.n,th.n{text-align:center}
tbody tr:last-child td{border-bottom:1px solid #000}
.fill td{height:auto;padding:0;border-bottom:1px solid #000}
.tot td{border:1px solid #000;padding:11px 8px;height:auto;font-family:"Courier New",Courier,monospace;font-weight:bold}
.pay{margin-top:26mm;margin-left:1mm}
.pay .a{color:#0000ff;margin:0 0 14px}
.pay p{margin:0 0 14px;font-weight:bold}
.empty{font-family:Arial;padding:40px 0;text-align:center;color:#777}
@media print{
 html,body{background:#fff}.bar{display:none}.scroll{padding:0;overflow:visible}
 .sheet{margin:0;width:210mm;min-height:297mm}
 @page{size:A4;margin:0}
}
</style>
</head>
<body>
<div class="bar">
 <button id="rf">Refresh from sheet</button>
 <button id="up">Upload CSV</button>
 <button id="pt">Paste data</button>
 <select id="sel"></select>
 <button id="pdf">Save as PDF</button>
 <span id="msg"></span>
 <textarea id="paste" placeholder="Paste cells copied from Google Sheets, including the header row, then click Paste data again"></textarea>
 <input type="file" id="fi" accept=".csv,.tsv,.txt" hidden>
</div>
<div class="scroll"><div class="sheet" id="sheet"></div></div>

<script>
const LOGO="logo.png";
const $=id=>document.getElementById(id);
const ALIAS={invoice:['invoice','invoice no','invoice number','invoice #'],billto:['bill to','billto','client','customer','name'],date:['invoice date','date'],product:['product','description','item','goods'],qty:['qty','quantity'],amount:['shipping amount','shipping','amount','price']};
let groups={},labels={};
function get(row,key){const ks=Object.keys(row);for(const a of ALIAS[key]){const k=ks.find(x=>x.trim().toLowerCase()===a);if(k!==undefined)return String(row[k]??'').trim()}return ''}
const num=v=>{const n=parseFloat(String(v).replace(/[^0-9.\-]/g,''));return isNaN(n)?null:n};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});

function ingest(text){
 const r=Papa.parse(text.trim(),{header:true,skipEmptyLines:true});
 groups={};
 let lb='',ld='';labels={};
 r.data.forEach(row=>{
  const b=get(row,'billto')||lb;lb=b;
  row['Bill To']=b;
  if(!b)return;
  const id=b.toLowerCase().replace(/\s+/g,' ');
  (groups[id]=groups[id]||[]).push(row);
  if(!labels[id])labels[id]=b.replace(/\s+/g,' ');
 });
 const ids=Object.keys(groups).sort((x,y)=>labels[x].localeCompare(labels[y]));
 $('sel').innerHTML=ids.map(i=>`<option value="${esc(i)}">${esc(labels[i])} (${groups[i].length})</option>`).join('');
 $('msg').textContent=ids.length?r.data.length+' rows, '+ids.length+' customer(s)':'No rows found';
 render();
}
function render(){
 const rows=groups[$('sel').value];
 let body='',total=0;
 if(rows){
  body=rows.map(r=>{const a=get(r,'amount'),n=num(a);if(n!==null)total+=n;
   return `<tr><td>${esc(get(r,'product'))}</td><td class="n">${esc(get(r,'qty'))}</td><td class="n">${n!==null?'GHS '+fmt(n):esc(a)}</td></tr>`}).join('');
 }
 const f=rows?{'Bill To':rows[0]['Bill To'],'Invoice Date':new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}:{};
 $('sheet').innerHTML=`<div class="wm">BLUEWAVE IMPORTS GHANA</div><div class="c">
 <img class="logo" src="${LOGO}" alt="BlueWave">
 <div class="title">INVOICE</div>
 <div class="meta mono"><div>BILL TO :<span>${esc(get(f,'billto'))}</span></div><div>INVOICE DATE:<span>${esc(get(f,'date'))}</span></div></div>
 <table><colgroup><col style="width:44.5%"><col style="width:13%"><col style="width:42.5%"></colgroup>
 <thead><tr><th>Product</th><th>QTY</th><th>Shipping Amount</th></tr></thead>
 <tbody>${body}<tr class="fill"><td style="height:${rows?Math.max(20,260-rows.length*30):260}px"></td><td></td><td></td></tr></tbody></table>
 <table class="tot" style="margin-top:0"><colgroup><col style="width:44%"><col style="width:26%"><col style="width:30%"></colgroup><tr><td></td><td>TOTAL</td><td class="n">${rows?'GHS '+fmt(total):''}</td></tr></table>
 <div class="pay"><p class="a">Make all payments to :</p><p>MOMO PAY ID :637569 (Belinda Maame Esi Kaledzie)</p><p>MOBILE MONEY :024 1902 468 (Belinda Maame Esi Kaledzie)</p></div></div>`;
}
$('up').onclick=()=>$('fi').click();
$('fi').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(ingest)};
$('pt').onclick=()=>{const p=$('paste');if(p.style.display==='block'){if(p.value.trim())ingest(p.value);p.style.display='none'}else p.style.display='block'};
$('sel').onchange=render;
$('pdf').onclick=()=>{if(!groups[$('sel').value]){$('msg').textContent='Load data first';return}document.title='Invoice '+$('sel').value;window.print()};
async function load(){
 $('msg').textContent='Loading…';
 try{
  const get1=k=>fetch('/api/sheet',{headers:{'x-access-key':k}});
  let key=sessionStorage.getItem('k')||'';
  let r=await get1(key);
  if(r.status===401){key=prompt('Access key')||'';if(!key)throw new Error('Access key required');sessionStorage.setItem('k',key);r=await get1(key)}
  if(r.status===401){sessionStorage.removeItem('k');throw new Error('Wrong access key')}
  if(!r.ok)throw new Error(r.status===500?'Sheet not configured':'Could not load sheet');
  ingest(await r.text());
 }catch(e){$('msg').textContent=e.message+'. You can use Upload CSV or Paste data instead.'}
}
$('rf').onclick=load;
render();
load();
</script>
</body>
</html>
